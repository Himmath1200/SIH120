# Render Blueprint - free web service for the FastAPI backend.
services:
  - type: web
    name: baghewala-digital-twin-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false   # set to https://YOUR-PROJECT.vercel.app in the Render dashboard
